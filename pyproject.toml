[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asg-multi-agents"
version = "0.1.0"
description = "Local-first sidecar coordinator for GitHub projects"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentsctl = "multi_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
